<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>广告复盘</title><style>

:root{--deep:#3f0069;--purple:#a04bfc;--pale:#f4eefd;--border:#e6d9fa;--muted:#665573}*{box-sizing:border-box}body{margin:0;background:#faf7ff;color:#2d2037;font:15px/1.65 "Microsoft YaHei",sans-serif}main{max-width:1280px;margin:auto;padding:24px}header{background:linear-gradient(115deg,#3f0069,#752cb0);color:white;padding:28px;border-radius:16px}h1{margin:0;font-size:32px}h2,h3,h4{margin:0 0 8px;color:var(--deep)}p{margin:8px 0}nav{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}nav a{padding:8px 17px;border:1px solid var(--border);background:white;border-radius:8px;color:var(--deep);text-decoration:none;font-weight:bold}nav a[aria-current]{background:var(--deep);color:white}section{background:white;border:1px solid var(--border);padding:19px;margin-bottom:15px;border-radius:12px}.call{border-left:5px solid var(--purple)}.grid,.line-grid,.mini{display:grid;gap:10px}.grid{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}.line-grid,.mini{grid-template-columns:repeat(2,minmax(0,1fr))}article,details{background:var(--pale);border:1px solid var(--border);padding:13px;border-radius:9px}article strong{display:block;font-size:22px;color:var(--deep)}small,footer,em{color:var(--muted);font-style:normal}details[open]{grid-column:1/-1}summary{cursor:pointer;color:var(--deep)}.mini{font-size:13px;margin-top:5px;color:#291a36}.action{background:white;padding:9px;border-radius:6px;margin:12px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 12px}th,td{white-space:nowrap;padding:7px 9px;text-align:right;border:1px solid var(--border)}th:first-child{text-align:left}thead{background:var(--pale)}footer{font-size:13px}a:focus-visible,summary:focus-visible{outline:3px solid var(--purple);outline-offset:2px}@media(max-width:720px){main{padding:12px}.line-grid,.mini{grid-template-columns:1fr}header,section{padding:14px}h1{font-size:25px}}



.line-grid{grid-template-columns:minmax(0,1fr)}.line-grid details{background:#fff;border-left:4px solid #a04bfc;padding:14px 18px}.line-grid summary>b{font-size:18px}.line-grid .mini{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:9px 0 0}.metric{border-top:1px solid var(--border);padding-top:7px;min-width:0}.metric strong{display:block;font-size:21px;color:var(--deep);font-variant-numeric:tabular-nums}.delta{font-weight:700}.good{color:#167353}.bad{color:#a63153}.neutral{color:#6a3d91}.bars{display:grid;gap:3px;margin-top:5px}.bars i{height:4px;border-radius:4px;background:#d9c6ec}.bars i+i{background:#8646ba}.sp-child th{color:#694187;padding-left:17px}.scope-note{font-size:12px;color:var(--muted)}@media(max-width:720px){.line-grid .mini{grid-template-columns:repeat(2,minmax(0,1fr))}}

.overview-breakdown .period-pair{font-variant-numeric:tabular-nums;color:var(--muted)}.overview-breakdown .period-pair strong{color:#291a36}.spend-change{text-align:right;font-variant-numeric:tabular-nums}.spend-change small{display:inline-block;margin-left:6px}.spend-change.in{color:#623397}.spend-change.out{color:#a04b61}.spend-track{height:5px;margin-top:4px;position:relative;background:#f6effb;border-radius:4px}.spend-track:before{content:"";position:absolute;left:50%;height:100%;border-left:1px solid #c5afda}.spend-track i{position:absolute;height:100%;border-radius:3px}.in .spend-track i{left:50%;background:#8750bd}.out .spend-track i{right:50%;background:#ba6580}.grid .kpi-change{display:block;margin-top:4px;font-size:14px;font-weight:700}.grid .kpi-change.good{color:#08734e}.grid .kpi-change.bad{color:#ad2345}.grid .kpi-change.neutral{color:#655573}.explorer-filters{display:flex;flex-wrap:wrap;align-items:end;gap:10px 16px;margin:12px 0}.explorer-filters label{display:grid;gap:4px;color:var(--deep);font-weight:bold}.explorer-filters select,.explorer-filters button{font:inherit;background:#fff;color:var(--deep);border:1px solid #b99bd4;border-radius:8px;padding:7px 11px}.explorer-filters select{min-width:160px}.explorer-filters button{cursor:pointer}.explorer-filters button:hover{background:var(--pale)}.explorer-filters :focus-visible{outline:3px solid var(--purple);outline-offset:2px}#explorer-count,#explorer-empty{color:var(--muted)}#explorer-results tfoot{background:var(--pale);font-weight:700}#explorer-results tfoot th,#explorer-results tfoot td{color:var(--deep);border-top:2px solid #b99bd4}.focus-section .line-grid{margin-top:14px}.focus-section table td:last-child{text-align:left}
.focus-intro p{max-width:90ch}.focus-list{display:grid;gap:14px;margin:0 0 16px}.focus-card{margin:0;border-left:4px solid #a04bfc}
.focus-card h3{font-size:21px;margin:0}.focus-card code{font:inherit;letter-spacing:.03em}.focus-rank{color:#753a9c;font-size:15px;margin-right:8px}
.focus-meta{color:var(--muted);margin:4px 0 0}.focus-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.focus-metric{background:var(--pale);border-radius:8px;padding:8px 11px;min-width:0;font-variant-numeric:tabular-nums}
.focus-metric strong,.focus-metric span{display:block}.focus-metric strong{color:var(--deep);font-size:17px}.focus-metric span{font-size:13px}
.focus-notes{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:0}.focus-notes div{border-top:1px solid var(--border);padding-top:7px}
.focus-notes dt{font-weight:700;color:var(--deep)}.focus-notes dd{margin:2px 0 0}.focus-method{color:var(--muted);font-size:13px}
@media(max-width:680px){.focus-metrics,.focus-notes{grid-template-columns:1fr}}

.focus-banner{display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(112deg,#3f0069,#67249b);color:#fff;padding:24px 28px;border:0}
.focus-banner h2{color:inherit;margin:0;font-size:25px}.focus-banner p{margin:5px 0 0;color:#f0defb}.focus-banner .focus-count{display:flex;align-items:baseline;gap:8px;white-space:nowrap;margin:0}.focus-count strong{font-size:clamp(36px,6vw,62px);line-height:1;color:white}.focus-count span{font-weight:700}
.focus-list details.focus-card{padding:0;background:white}.focus-summary{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) 14px;align-items:center;gap:14px;padding:13px 16px;list-style:none;border-radius:8px;cursor:pointer}.focus-summary::-webkit-details-marker{display:none}.focus-summary:hover{background:#faf6ff}.focus-summary .focus-rank{margin:0;background:var(--pale);padding:4px 7px;border-radius:6px;font-weight:700}
.focus-identity strong,.focus-identity small{display:block}.focus-identity strong{font-variant-numeric:tabular-nums;font-size:17px;color:var(--deep)}.focus-identity small{line-height:1.45}.focus-reason{color:#5a2b82;font-weight:700;font-size:14px}.focus-chevron{border-right:2px solid #6d3990;border-bottom:2px solid #6d3990;width:8px;height:8px;transform:rotate(45deg);justify-self:center}details[open] .focus-chevron{transform:rotate(225deg)}.focus-detail{padding:0 16px 14px;border-top:1px solid var(--border)}
@media(max-width:680px){.focus-banner{padding:15px;gap:10px}.focus-banner h2{font-size:19px}.focus-banner p{font-size:13px}.focus-count span{font-size:12px}.focus-summary{grid-template-columns:auto minmax(0,1fr) 14px;gap:5px 9px;padding:10px}.focus-reason{grid-column:2;grid-row:2}.focus-chevron{grid-column:3;grid-row:1 / span 2}.focus-rank{align-self:start}}
</style></head>
<body><main id="report"></main>
<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>__REPORT_SCRIPT__</script>
</body></html>
